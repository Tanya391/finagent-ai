services:
  # ---------------------------------------------------------------------------
  # Backend — Django REST API
  # ---------------------------------------------------------------------------
  - type: web
    name: finagent-server
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/v1/status/
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: finagent-server.onrender.com
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard — contains credentials
      - key: DB_NAME
        value: finagent_ai
      - key: MONGO_TRANSACTIONS_COLLECTION
        value: transactions
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: 30000
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: 30000
      - key: MONGO_SOCKET_TIMEOUT_MS
        value: 30000
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: RAG_TOP_K
        value: 8
      - key: QDRANT_URL
        sync: false          # set manually if using Qdrant Cloud, leave blank to skip
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: transactions
      - key: QDRANT_VECTOR_SIZE
        value: 384
      - key: LLM_FALLBACK_ORDER
        value: groq,huggingface
      - key: LLM_TIMEOUT_SEC
        value: 12
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: HF_BASE_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: PYTHON_VERSION
        value: 3.11.0

  # ---------------------------------------------------------------------------
  # Frontend — React/Vite Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: finagent-ui
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://finagent-server.onrender.com/api/v1
