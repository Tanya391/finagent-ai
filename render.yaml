services:
  # ---------------------------------------------------------------------------
  # Backend — pulls Docker image from DockerHub
  # Image is built and pushed by GitHub Actions on every push to main
  # ---------------------------------------------------------------------------
  - type: web
    name: finagent-server
    image:
      url: docker.io/tanya391/finagent-server:latest
    healthCheckPath: /api/v1/status/
    envVars:
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: finagent-server.onrender.com
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: finagent_ai
      - key: MONGO_TRANSACTIONS_COLLECTION
        value: transactions
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: 30000
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: 30000
      - key: MONGO_SOCKET_TIMEOUT_MS
        value: 30000
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: RAG_TOP_K
        value: 8
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: transactions
      - key: QDRANT_VECTOR_SIZE
        value: 384
      - key: LLM_FALLBACK_ORDER
        value: groq,huggingface
      - key: LLM_TIMEOUT_SEC
        value: 12
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: HF_BASE_URL
        value: https://router.huggingface.co/v1/chat/completions

  # ---------------------------------------------------------------------------
  # Frontend — pulls Docker image from DockerHub
  # ---------------------------------------------------------------------------
  - type: web
    name: finagent-ui
    image:
      url: docker.io/tanya391/finagent-ui:latest
    envVars:
      - key: PORT
        value: 80
