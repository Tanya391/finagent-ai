version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: finagent_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: finance_ai

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finagent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
